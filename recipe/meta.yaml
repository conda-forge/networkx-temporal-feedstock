{% set name = "networkx-temporal" %}
{% set version = "1.4.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/networkx_temporal-{{ version }}.tar.gz
  sha256: 401130124551089f1f9bfedd1a841cfa9c41b54258c0403f8a3418927441896c
  patches:
    # upstream 1.4.4 has a stray `from turtle import pd`, which needs Tk/X11 at import time
    - remove-turtle-import.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - networkx >=2.1
    - numpy >=1.17.3
    - pandas >=1.1.0
    - scipy >=1.7.3

test:
  imports:
    - networkx_temporal
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Python package to build and manipulate dynamic NetworkX graphs.
  home: https://networkx-temporal.readthedocs.io/
  license: BSD-3-Clause
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - mediocretech
